server:
  port: ${PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: identity-service
  flyway:
    enabled: false   # tenant-starter tự chạy Flyway cho từng tenant
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    # Dev: Mailpit (docker compose up -d mailpit), xem thư tại http://localhost:8025
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

microinvent:
  tenant:
    default-tenant: ${DEFAULT_TENANT:tigernet}
    tenants: ${TENANTS:tigernet}
    url-template: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/identity_%s?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jwt:
    # Bắt buộc đặt JWT_SECRET (>= 32 byte, trùng với api-gateway); thiếu thì service không khởi động.
    # Chạy local dùng profile "dev" (application-dev.yml).
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  internal:
    # Bắt buộc đặt INTERNAL_API_KEY; thiếu thì service không khởi động.
    api-key: ${INTERNAL_API_KEY}
  mail:
    from: ${MAIL_FROM:no-reply@microinvent.local}
