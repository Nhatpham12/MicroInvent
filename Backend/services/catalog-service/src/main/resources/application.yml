server:
  port: ${PORT:8082}
  forward-headers-strategy: framework

spring:
  application:
    name: catalog-service
  flyway:
    enabled: false   # tenant-starter tự chạy Flyway cho từng tenant
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

microinvent:
  tenant:
    default-tenant: ${DEFAULT_TENANT:tigernet}
    tenants: ${TENANTS:tigernet}
    url-template: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/catalog_%s?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  internal:
    # Bắt buộc đặt INTERNAL_API_KEY; thiếu thì service không khởi động.
    api-key: ${INTERNAL_API_KEY}
  catalog:
    # Khóa AES-256 (base64, 32 byte) mã hóa STK NCC / CCCD khách. Sinh: openssl rand -base64 32.
    # Bắt buộc đặt CATALOG_ENCRYPTION_KEY; thiếu thì service không khởi động. MẤT KHÓA = MẤT DỮ LIỆU ĐÃ MÃ HÓA.
    encryption-key: ${CATALOG_ENCRYPTION_KEY}
    image-dir: ${CATALOG_IMAGE_DIR:./data/product-images}
    max-image-size: 2MB
    max-import-rows: 2000
    max-export-rows: 10000
