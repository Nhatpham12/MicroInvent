# sales-service – SINH TỰ ĐỘNG từ springdoc (GET /v3/api-docs của service, profile dev), 23/11/2026.
# Sinh lại khi đổi API: chạy service rồi tải http://localhost:<port>/v3/api-docs, đổi servers về gateway.
# Hiện có: phiếu xuất /api/v1/exports (T31 – Quân). Thanh toán / công nợ (T34 – Nhật) bổ sung khi có code.
openapi: 3.1.0
info:
  title: MicroInvent – sales-service
  version: v1
servers:
- url: http://localhost:8080
  description: api-gateway
security:
- bearerAuth: []
paths:
  /api/v1/exports/{id}:
    get:
      tags:
      - Phiếu xuất
      summary: Chi tiết phiếu xuất
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExportSlipResponse"
    put:
      tags:
      - Phiếu xuất
      summary: Sửa phiếu khi chưa xuất (giữ lại hàng theo dòng mới; phiếu đã xác nhận
        quay về chờ xác nhận)
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportSlipRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExportSlipResponse"
  /api/v1/exports:
    get:
      tags:
      - Phiếu xuất
      summary: "Danh sách phiếu xuất (lọc kho, khách, trạng thái, loại, khoảng ngà\
        y tạo, mã phiếu)"
      operationId: list
      parameters:
      - name: warehouseId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: customerId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - EXPORTED
          - CANCELLED
      - name: exportType
        in: query
        required: false
        schema:
          type: string
          enum:
          - SALE
          - DAMAGED
          - WARRANTY
          - RETURN_SUPPLIER
          - OTHER
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseExportSlipResponse"
    post:
      tags:
      - Phiếu xuất
      summary: "Tạo phiếu xuất (giữ hàng tại kho xuất; thiếu hàng → lưu chưa giữ,\
        \ trả shortages để tách phiếu)"
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportSlipRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExportSlipResponse"
  /api/v1/exports/{id}/split:
    post:
      tags:
      - Phiếu xuất
      summary: "Tách phiếu theo kho: chuyển một phần số lượng / serial sang phiếu\
        \ con ở kho khác rồi giữ hàng lại"
      operationId: split
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExportSlipResponse"
  /api/v1/exports/{id}/export:
    post:
      tags:
      - Phiếu xuất
      summary: "Xuất kho: trừ tồn, ghi giá vốn + bảo hành, phát export.exported"
      operationId: export
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExportSlipResponse"
  /api/v1/exports/{id}/confirm:
    post:
      tags:
      - Phiếu xuất
      summary: "Xác nhận: chờ xác nhận → đã xác nhận (phải giữ đủ hàng)"
      operationId: confirm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExportSlipResponse"
  /api/v1/exports/{id}/cancel:
    post:
      tags:
      - Phiếu xuất
      summary: "Hủy phiếu chưa xuất, nhả hàng đang giữ"
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExportSlipResponse"
  /api/v1/exports/check-availability:
    post:
      tags:
      - Phiếu xuất
      summary: Kiểm tồn khả dụng tại kho xuất + kho khác còn hàng (không giữ hàng)
      operationId: checkAvailability
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseJsonNode"
  /health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
  /api/v1/exports/{id}/pdf:
    get:
      tags:
      - Phiếu xuất
      summary: "In phiếu xuất PDF (tên + địa chỉ kho xuất, khách, dòng hàng, serial,\
        \ bảo hành)"
      operationId: pdf
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
components:
  schemas:
    ExportSlipRequest:
      type: object
      properties:
        warehouseId:
          type: integer
          format: int32
        exportType:
          type: string
          enum:
          - SALE
          - DAMAGED
          - WARRANTY
          - RETURN_SUPPLIER
          - OTHER
        customerId:
          type: integer
          format: int32
        deliveryMethod:
          type: string
          enum:
          - PICKUP
          - CARRIER
        trackingNo:
          type: string
          maxLength: 100
          minLength: 0
        vatRate:
          type: string
          enum:
          - NONE
          - "0"
          - "5"
          - "8"
          - "10"
        depositAmount:
          type: number
          minimum: 0
        dueDate:
          type: string
          format: date
        salesUserId:
          type: integer
          format: int32
        note:
          type: string
          maxLength: 2000
          minLength: 0
        lines:
          type: array
          items:
            $ref: "#/components/schemas/Line"
          maxItems: 200
          minItems: 0
      required:
      - lines
      - warehouseId
    Line:
      type: object
      properties:
        productId:
          type: integer
          format: int32
        qty:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: number
          minimum: 0
        serials:
          type: array
          items:
            type: string
            maxLength: 255
            minLength: 0
      required:
      - productId
      - qty
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
    ApiResponseExportSlipResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/ExportSlipResponse"
        meta: {}
        error:
          $ref: "#/components/schemas/ApiError"
    ExportSlipResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        code:
          type: string
        exportType:
          type: string
          enum:
          - SALE
          - DAMAGED
          - WARRANTY
          - RETURN_SUPPLIER
          - OTHER
        warehouseId:
          type: integer
          format: int32
        customerId:
          type: integer
          format: int32
        customer:
          type: object
          additionalProperties: {}
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - EXPORTED
          - CANCELLED
        stockReserved:
          type: boolean
        exportDate:
          type: string
          format: date-time
        deliveryMethod:
          type: string
          enum:
          - PICKUP
          - CARRIER
        trackingNo:
          type: string
        vatRate:
          type: string
          enum:
          - NONE
          - "0"
          - "5"
          - "8"
          - "10"
        subtotal:
          type: number
        vatAmount:
          type: number
        totalAmount:
          type: number
        depositAmount:
          type: number
        paidAmount:
          type: number
        paymentStatus:
          type: string
          enum:
          - UNPAID
          - PARTIAL
          - PAID
        dueDate:
          type: string
          format: date
        salesUserId:
          type: integer
          format: int32
        splitFromId:
          type: integer
          format: int32
        note:
          type: string
        createdBy:
          type: integer
          format: int32
        confirmedBy:
          type: integer
          format: int32
        exportedBy:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/Line"
        shortages:
          type: array
          items:
            $ref: "#/components/schemas/Shortage"
        unavailableSerials:
          type: array
          items:
            type: string
        splitSlips:
          type: array
          items:
            $ref: "#/components/schemas/ExportSlipResponse"
    OtherWarehouse:
      type: object
      properties:
        warehouseId:
          type: integer
          format: int32
        warehouseName:
          type: string
        available:
          type: integer
          format: int32
    Shortage:
      type: object
      properties:
        productId:
          type: integer
          format: int32
        requested:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
        shortage:
          type: integer
          format: int32
        otherWarehouses:
          type: array
          items:
            $ref: "#/components/schemas/OtherWarehouse"
    Allocation:
      type: object
      properties:
        warehouseId:
          type: integer
          format: int32
        lines:
          type: array
          items:
            $ref: "#/components/schemas/Line"
          maxItems: 200
          minItems: 0
      required:
      - lines
      - warehouseId
    SplitRequest:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
          maxItems: 20
          minItems: 0
      required:
      - allocations
    AvailabilityRequest:
      type: object
      properties:
        warehouseId:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
          maxItems: 200
          minItems: 0
      required:
      - items
      - warehouseId
    Item:
      type: object
      properties:
        productId:
          type: integer
          format: int32
        qty:
          type: integer
          format: int32
          minimum: 1
      required:
      - productId
      - qty
    ApiResponseJsonNode:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/JsonNode"
        meta: {}
        error:
          $ref: "#/components/schemas/ApiError"
    JsonNode: {}
    ApiResponseMapStringObject:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: {}
        meta: {}
        error:
          $ref: "#/components/schemas/ApiError"
    ApiResponsePageResponseExportSlipResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/PageResponseExportSlipResponse"
        meta: {}
        error:
          $ref: "#/components/schemas/ApiError"
    PageResponseExportSlipResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ExportSlipResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
