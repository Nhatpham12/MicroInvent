# notification-service – SINH TỰ ĐỘNG từ springdoc (GET /v3/api-docs của service, profile dev), 20/11/2026.
# Sinh lại khi đổi API: chạy service rồi tải http://localhost:<port>/v3/api-docs, đổi servers về gateway.
openapi: 3.1.0
info:
  title: MicroInvent – notification-service
  version: v1
servers:
- url: http://localhost:8080
  description: api-gateway
security:
- bearerAuth: []
paths:
  /internal/notifications:
    post:
      tags:
      - Nội bộ – thông báo
      summary: Tạo cảnh báo cho danh sách người nhận và đẩy realtime
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseMapStringInteger'
  /api/v1/notifications/{id}/resolve:
    patch:
      tags:
      - Thông báo
      summary: Đánh dấu đã xử lý
      operationId: resolve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseNotificationResponse'
  /api/v1/notifications/{id}/read:
    patch:
      tags:
      - Thông báo
      summary: Đánh dấu đã đọc
      operationId: read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseNotificationResponse'
  /api/v1/notifications/read-all:
    patch:
      tags:
      - Thông báo
      summary: Đánh dấu tất cả đã đọc
      operationId: readAll
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseMapStringInteger'
  /health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseMapStringObject'
  /api/v1/notifications:
    get:
      tags:
      - Thông báo
      summary: Danh sách cảnh báo của tôi (mới nhất trước)
      description: Lọc unread=true, resolved=false, type, warehouseId. Cảnh báo của kho không còn được gán bị ẩn.
      operationId: list
      parameters:
      - name: unread
        in: query
        required: false
        schema:
          type: boolean
      - name: resolved
        in: query
        required: false
        schema:
          type: boolean
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - LOW_STOCK
          - RENT_DUE
          - LOAN_DUE
          - RENT_OVERDUE
          - APPROVAL_PENDING
          - TRANSFER_OVERDUE
          - TRANSFER_DISCREPANCY
          - HOLD_EXPIRING
          - DEBT_OVERDUE
          - SYNC_CONFLICT
      - name: warehouseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseNotificationResponse'
  /api/v1/notifications/unread-count:
    get:
      tags:
      - Thông báo
      summary: Số cảnh báo chưa đọc (chuông)
      operationId: unreadCount
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseMapStringLong'
components:
  schemas:
    CreateNotificationRequest:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: integer
            format: int32
          maxItems: 500
          minItems: 0
        warehouseId:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - LOW_STOCK
          - RENT_DUE
          - LOAN_DUE
          - RENT_OVERDUE
          - APPROVAL_PENDING
          - TRANSFER_OVERDUE
          - TRANSFER_DISCREPANCY
          - HOLD_EXPIRING
          - DEBT_OVERDUE
          - SYNC_CONFLICT
        title:
          type: string
          maxLength: 255
          minLength: 0
        message:
          type: string
          maxLength: 5000
          minLength: 0
        refType:
          type: string
          maxLength: 30
          minLength: 0
        refId:
          type: integer
          format: int32
      required:
      - title
      - type
      - userIds
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
    ApiResponseMapStringInteger:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties:
            type: integer
            format: int32
        meta: {}
        error:
          $ref: '#/components/schemas/ApiError'
    ApiResponseNotificationResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/NotificationResponse'
        meta: {}
        error:
          $ref: '#/components/schemas/ApiError'
    NotificationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - LOW_STOCK
          - RENT_DUE
          - LOAN_DUE
          - RENT_OVERDUE
          - APPROVAL_PENDING
          - TRANSFER_OVERDUE
          - TRANSFER_DISCREPANCY
          - HOLD_EXPIRING
          - DEBT_OVERDUE
          - SYNC_CONFLICT
        title:
          type: string
        message:
          type: string
        warehouseId:
          type: integer
          format: int32
        refType:
          type: string
        refId:
          type: integer
          format: int32
        read:
          type: boolean
        resolved:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ApiResponseMapStringObject:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: {}
        meta: {}
        error:
          $ref: '#/components/schemas/ApiError'
    ApiResponsePageResponseNotificationResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PageResponseNotificationResponse'
        meta: {}
        error:
          $ref: '#/components/schemas/ApiError'
    PageResponseNotificationResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ApiResponseMapStringLong:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties:
            type: integer
            format: int64
        meta: {}
        error:
          $ref: '#/components/schemas/ApiError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
